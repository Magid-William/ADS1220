# ---------------------------------------------------------------------------
# ADS1220 + 4-wire TrackPoint bench configuration.
# EXP02 made it a maximum-logging build; EXP04 turns it into a quiet build that
# logs ONE paired raw X/Y line per poll and nothing else, for a motion capture.
# Not a shipping configuration.
# ---------------------------------------------------------------------------

# --- ADS1220 ADC + IDAC ----------------------------------------------------
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_INPUT=y
CONFIG_INPUT_ANALOG_AXIS_HIRES=y
CONFIG_MULTITHREADING=y

# CS is driven from P0.10. On nRF52840, P0.09/P0.10 default to the NFC antenna
# pins (NFC1/NFC2) and are NOT GPIO - without this the SPIM cannot drive CS and
# the ADS1220 never gets selected (MISO reads 0xFF). EXP03.
CONFIG_NFCT_PINS_AS_GPIOS=y

# NOTE: INPUT_ANALOG_AXIS_HIRES_SETTINGS is intentionally NOT set. It
# `depends on SETTINGS`, which is n here, so assigning it y only produces a
# Kconfig warning and does nothing. Per-boot auto-calibration (in-calib-cycle)
# covers bring-up; enable CONFIG_SETTINGS in a later experiment if persisted
# calibration is wanted.

# --- ZMK pointing: forward analog-axis events to the HID mouse -------------
CONFIG_ZMK_POINTING=y

# --- Logging core (zmk-usb-logging snippet routes it to USB CDC-ACM) --------
# Deferred mode + a large buffer so the 8 ms poll loop never blocks on the log.
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=32768
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10

# IMPORTANT: enabling CONFIG_SHELL_BACKEND_SERIAL makes Zephyr default
# CONFIG_LOG_BACKEND_UART to *n* (its Kconfig is `default y if
# !SHELL_BACKEND_SERIAL`), leaving the shell log backend as the only output.
# Force the UART backend so logs reach the console independently of the shell
# state, and disable the shell backend so lines are not printed twice.
CONFIG_LOG_BACKEND_UART=y
CONFIG_SHELL_LOG_BACKEND=n

# Wait before flushing the log so an early attach still catches boot messages.
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=3000

# Log level ERR on every driver in the ADS1220 path: the paired X/Y logger is
# the only output we want during a capture. Genuine errors stay visible.
# (EXP02 used DBG here - that floods the console with per-change driver lines
# plus zmk_hid_mouse_* noise.)
CONFIG_ZMK_LOG_LEVEL_ERR=y
CONFIG_ADC_LOG_LEVEL_ERR=y
CONFIG_GPIO_LOG_LEVEL_ERR=y
CONFIG_INPUT_LOG_LEVEL_ERR=y

# Wire-level view of the SPI handshake: status of every driver SPI transaction
# (reset / config write / config readback / RDATA). spi_nrfx_spim logs each.
# NOTE: leave OFF for a full boot capture. At DBG the SPI context logs ~5 lines
# per transaction; during the 100-sample calibration burst that floods the USB
# CDC-ACM TX ring and truncates the log. Register-level handshake is available
# on demand from the `spi` shell, and SPI errors still surface at the default
# INF level.
# CONFIG_SPI_LOG_LEVEL_DBG=y

# USB CDC-ACM TX ring: the boot log burst overflows the ZMK default (1024 B)
# and cuts lines mid-message. EXP04 streams ~125 paired lines/s for the whole
# capture, so give it more headroom still.
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=16384

# --- Zephyr shell on the same CDC-ACM console ------------------------------
# There is no ZMK-specific shell; this is the stock Zephyr shell.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_SERIAL_INIT_PRIORITY=51
CONFIG_SHELL_CMDS=y

# --- Bring-up command set --------------------------------------------------
# log: enable/disable/level <module> at runtime
CONFIG_LOG_CMDS=y
# gpio: get/set (poke the IDAC line, read DRDY)
CONFIG_GPIO_SHELL=y
# kernel: version/uptime/threads/reboot, devmem
CONFIG_KERNEL_SHELL=y
# device: list devices and their init state
CONFIG_DEVICE_SHELL=y
# spi: conf / transceive (manual RESET, CONFIG read, RDATA)
CONFIG_SPI_SHELL=y

# --- EXP02 application hooks (exp02_logging.c) -----------------------------
# The `tpoint` shell command + per-sample raw-data callback.
CONFIG_EXP02_LOGGING=y

# --- EXP04 circle-motion capture -------------------------------------------
# Auto-enable the paired raw X/Y logger at boot ('XY <ms> <x> <y>' per poll).
CONFIG_EXP04_XY_LOG=y
