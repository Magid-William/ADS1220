# ---------------------------------------------------------------------------
# EXP02 bench bring-up configuration: ADS1220 + 4-wire TrackPoint.
# Maximum-logging build on purpose. Not a shipping configuration.
# ---------------------------------------------------------------------------

# --- ADS1220 ADC + IDAC ----------------------------------------------------
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_INPUT=y
CONFIG_INPUT_ANALOG_AXIS_HIRES=y
CONFIG_MULTITHREADING=y

# NOTE: INPUT_ANALOG_AXIS_HIRES_SETTINGS is intentionally NOT set. It
# `depends on SETTINGS`, which is n here, so assigning it y only produces a
# Kconfig warning and does nothing. Per-boot auto-calibration (in-calib-cycle)
# covers bring-up; enable CONFIG_SETTINGS in a later experiment if persisted
# calibration is wanted.

# --- ZMK pointing: forward analog-axis events to the HID mouse -------------
CONFIG_ZMK_POINTING=y

# --- Logging core (zmk-usb-logging snippet routes it to USB CDC-ACM) --------
# Deferred mode + a large buffer so the 8 ms poll loop never blocks on the log.
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=32768
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10

# IMPORTANT: enabling CONFIG_SHELL_BACKEND_SERIAL makes Zephyr default
# CONFIG_LOG_BACKEND_UART to *n* (its Kconfig is `default y if
# !SHELL_BACKEND_SERIAL`), leaving the shell log backend as the only output.
# Force the UART backend so logs reach the console independently of the shell
# state, and disable the shell backend so lines are not printed twice.
CONFIG_LOG_BACKEND_UART=y
CONFIG_SHELL_LOG_BACKEND=n

# Wait before flushing the log so an early attach still catches boot messages.
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=3000

# DBG on every driver in the ADS1220 path.
CONFIG_ZMK_LOG_LEVEL_DBG=y
CONFIG_ADC_LOG_LEVEL_DBG=y
CONFIG_GPIO_LOG_LEVEL_DBG=y
CONFIG_INPUT_LOG_LEVEL_DBG=y

# Wire-level view of the SPI handshake: status of every driver SPI transaction
# (reset / config write / config readback / RDATA). spi_nrfx_spim logs each.
CONFIG_SPI_LOG_LEVEL_DBG=y

# --- Zephyr shell on the same CDC-ACM console ------------------------------
# There is no ZMK-specific shell; this is the stock Zephyr shell.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_SERIAL_INIT_PRIORITY=51
CONFIG_SHELL_CMDS=y

# --- Bring-up command set --------------------------------------------------
# log: enable/disable/level <module> at runtime
CONFIG_LOG_CMDS=y
# gpio: get/set (poke the IDAC line, read DRDY)
CONFIG_GPIO_SHELL=y
# kernel: version/uptime/threads/reboot, devmem
CONFIG_KERNEL_SHELL=y
# device: list devices and their init state
CONFIG_DEVICE_SHELL=y
# spi: conf / transceive (manual RESET, CONFIG read, RDATA)
CONFIG_SPI_SHELL=y

# --- EXP02 application hooks (exp02_logging.c) -----------------------------
# The `tpoint` shell command + per-sample raw-data callback.
CONFIG_EXP02_LOGGING=y
