# ---------------------------------------------------------------------------
# EXP01 bench bring-up configuration: ADS1220 + 4-wire TrackPoint.
# Debug-heavy on purpose. Not a shipping configuration.
# ---------------------------------------------------------------------------

# --- ADS1220 ADC + IDAC ----------------------------------------------------
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_INPUT=y
CONFIG_INPUT_ANALOG_AXIS_HIRES=y
CONFIG_INPUT_ANALOG_AXIS_HIRES_SETTINGS=y
CONFIG_MULTITHREADING=y

# --- ZMK pointing: forward analog-axis events to the HID mouse -------------
CONFIG_ZMK_POINTING=y

# --- Debug logging (zmk-usb-logging snippet routes it to USB CDC-ACM) ------
CONFIG_ZMK_LOG_LEVEL_DBG=y
CONFIG_ADC_LOG_LEVEL_DBG=y
CONFIG_GPIO_LOG_LEVEL_DBG=y
CONFIG_INPUT_LOG_LEVEL_DBG=y

# Wait before flushing the log so an early attach still catches boot messages.
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=3000

# --- Zephyr shell on the same CDC-ACM console ------------------------------
# There is no ZMK-specific shell; this is the stock Zephyr shell.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_SERIAL_INIT_PRIORITY=51
CONFIG_SHELL_CMDS=y
CONFIG_LOG_CMDS=y
CONFIG_GPIO_SHELL=y
